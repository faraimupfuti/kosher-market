name: Kosher Market CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, sqlite, pdo_sqlite, pdo_mysql
          coverage: none
      - name: Resolve Composer dependencies
        run: composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Apply Laravel Pint formatting
        run: vendor/bin/pint
      - name: Commit synchronized dependencies and formatting
        run: |
          if git diff --quiet; then
            echo "Working tree is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock app bootstrap config database routes tests
          git commit -m "Normalize Composer lockfile and PHP formatting"
          git push

  build:
    if: ${{ always() && (github.event_name == 'pull_request' || (needs.normalize.result == 'success' && github.event.head_commit.message != 'Normalize Composer lockfile and PHP formatting')) }}
    needs: normalize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, sqlite, pdo_sqlite, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  lint:
    if: ${{ always() && (github.event_name == 'pull_request' || (needs.normalize.result == 'success' && github.event.head_commit.message != 'Normalize Composer lockfile and PHP formatting')) }}
    needs: normalize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/pint --test

  test:
    if: ${{ always() && (github.event_name == 'pull_request' || (needs.normalize.result == 'success' && github.event.head_commit.message != 'Normalize Composer lockfile and PHP formatting')) }}
    needs: normalize
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, sqlite, pdo_sqlite, pdo_mysql
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Wait for MySQL
        shell: bash
        run: |
          for i in {1..30}; do
            if php -r '$pdo = new PDO("mysql:host=127.0.0.1;port=3306;dbname=testing", "root", "root", [PDO::ATTR_TIMEOUT => 2]); echo "MySQL is ready\n";' 2>/dev/null; then
              exit 0
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1
      - run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
      - run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
