services:
  - type: web
    name: velstore
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BTCPAY_URL
        sync: false
      - key: BTCPAY_STORE_ID
        sync: false
      - key: BTCPAY_API_KEY
        sync: false
      - key: BTCPAY_WEBHOOK_SECRET
        sync: false

  - type: cron
    name: velstore-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "*/5 * * * *"
    dockerCommand: "php artisan schedule:run"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BTCPAY_URL
        sync: false
      - key: BTCPAY_STORE_ID
        sync: false
      - key: BTCPAY_API_KEY
        sync: false
      - key: BTCPAY_WEBHOOK_SECRET
        sync: false
