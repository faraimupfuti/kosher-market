<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your cart — Kosher Market</title></head><body><main><h1>Your cart</h1>{% for item in items %}<article><h2>{{ item.product.title }}</h2><p>US$ {{ item.product.price_usd }} × {{ item.quantity }}</p><form method="post" action="{% url 'cart_remove' item.id %}">{% csrf_token %}<button>Remove</button></form></article>{% empty %}<p>Your cart is empty.</p>{% endfor %}<h2>Total: US$ {{ total }}</h2>{% if items %}<form method="post" action="{% url 'create_order' %}">{% csrf_token %}<button type="submit">Create order</button></form>{% endif %}<p><a href="/">Continue shopping</a></p></main></body></html>
