apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kosher-market
  namespace: kosher-market
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kosher-market.example
      secretName: kosher-market-tls
  rules:
    - host: kosher-market.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kosher-market-web
                port:
                  number: 80
