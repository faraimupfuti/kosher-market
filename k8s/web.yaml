apiVersion: apps/v1
kind: Deployment
metadata:
  name: kosher-market-web
  namespace: kosher-market
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: kosher-market-web
  template:
    metadata:
      labels:
        app: kosher-market-web
    spec:
      containers:
        - name: web
          image: ghcr.io/faraimupfuti/kosher-market:latest
          imagePullPolicy: Always
          command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: kosher-market-config
            - secretRef:
                name: kosher-market-secrets
          readinessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kosher-market-web
  namespace: kosher-market
spec:
  selector:
    app: kosher-market-web
  ports:
    - port: 80
      targetPort: 8000
