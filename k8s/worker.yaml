apiVersion: apps/v1
kind: Deployment
metadata:
  name: kosher-market-worker
  namespace: kosher-market
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kosher-market-worker
  template:
    metadata:
      labels:
        app: kosher-market-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: kosher-market-worker
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/faraimupfuti/kosher-market:latest
          imagePullPolicy: Always
          command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: kosher-market-config
            - secretRef:
                name: kosher-market-secrets
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
