apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-backups
  namespace: kosher-market
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  namespace: kosher-market
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: mysql:8.0
              env:
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: kosher-market-secrets
                      key: DB_PASSWORD
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  mkdir -p /backups
                  timestamp=$(date -u +%Y%m%dT%H%M%SZ)
                  mysqldump --single-transaction --quick --routines --triggers \
                    -h mysql -uroot -p"$MYSQL_ROOT_PASSWORD" kosher_market \
                    | gzip > "/backups/kosher_market_${timestamp}.sql.gz"
                  find /backups -type f -name '*.sql.gz' -mtime +7 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: mysql-backups
